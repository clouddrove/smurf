name: Publish docs via GitHub Pages
on:
  push:
    branches:
      - master
      - feat/mk-docs
  workflow_dispatch:
# Restrictive default; each job widens only as far as it needs.
permissions:
  contents: read

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    # `mkdocs gh-deploy` pushes the built site to the gh-pages branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Git Credentials
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Pinned rather than 3.x: watchdog, pulled in by mkdocs, ships no
          # cp314 wheel, so a runner moving to 3.14 would break the build.
          python-version: "3.13"

      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      # Install from the pinned manifest so the docs build is reproducible
      # and Dependabot has something to track.
      - run: "pip install --only-binary :all: -r docs/sm/docs/requirements.txt"

      - name: Deploy Documentation
        working-directory: ./docs/sm  # Specify your documentation directory here
        run: mkdocs gh-deploy --force

  deploy:
    name: Deploy Docs
    runs-on: ubuntu-latest
    environment:
      name: smurf-url
      url: https://smurf.clouddrove.com
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages
