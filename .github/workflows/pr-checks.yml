name: PR Validation

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  pr-validation:
    if: github.actor != 'dependabot[bot]'
    # Least privilege for the reusable workflow: it only checks out the repo,
    # reads PR labels and lints commit messages. Without this the job would
    # inherit the repository default token, which is write-scoped.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    uses: clouddrove/github-shared-workflows/.github/workflows/pr-checks.yml@8721a1cc73b0c1548b29171794250944ea4a17ef
