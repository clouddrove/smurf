name: Release
on:
  push:
    tags: [ v* ]
env:
  GO_VERSION: 1.27.1
  REPO: ${{ github.repository }}
  APP_PACKAGE: github.com/clouddrove/smurf/cmd
  BINARY_NAME: smurf

# Restrictive default; the jobs that need to write override it below.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        GOOS: [linux, darwin, windows]
        GOARCH: [amd64, arm64]
        include:
          - GOOS: windows
            ext: .exe
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Get Version from Tag
      id: version
      run: |
        echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        echo "Building version: ${GITHUB_REF#refs/tags/}"

    - name: Get Build Info
      id: buildinfo
      run: |
        set -euo pipefail
        echo "Collecting build information..."
        
        VERSION="${{ steps.version.outputs.version }}"
        COMMIT=$(git rev-parse --short HEAD)
        DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        
        echo "Version: $VERSION"
        echo "Commit: $COMMIT"
        echo "Build Date: $DATE"
        
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "commit=${COMMIT}" >> $GITHUB_OUTPUT
        echo "date=${DATE}" >> $GITHUB_OUTPUT

    - name: Build Binary with Version Injection
      run: |
        echo "Building ${{ env.BINARY_NAME }} for ${{ matrix.GOOS }}/${{ matrix.GOARCH }}"
        echo "Package: ${{env.APP_PACKAGE}}"
        echo "Version: ${{steps.buildinfo.outputs.version}}"
        
        OUTPUT_NAME="${{ env.BINARY_NAME }}"
        if [ "${{ matrix.GOOS }}" = "windows" ]; then
          OUTPUT_NAME="$OUTPUT_NAME.exe"
        fi
        
        # Create output directory
        mkdir -p "bin/${{ matrix.GOOS }}-${{ matrix.GOARCH }}"
        
        # CORRECTED BUILD COMMAND - using current directory (.)
        GOOS=${{ matrix.GOOS }} GOARCH=${{ matrix.GOARCH }} go build -a \
          -ldflags "\
            -X '${{env.APP_PACKAGE}}.version=${{steps.buildinfo.outputs.version}}' \
            -X '${{env.APP_PACKAGE}}.commit=${{steps.buildinfo.outputs.commit}}' \
            -X '${{env.APP_PACKAGE}}.date=${{steps.buildinfo.outputs.date}}'" \
          -o "bin/${{ matrix.GOOS }}-${{ matrix.GOARCH }}/$OUTPUT_NAME" .

    - name: Create Distribution Archive
      run: |
        mkdir -p dist
        
        ARCHIVE_NAME="${{ env.BINARY_NAME }}-${{ steps.buildinfo.outputs.version }}-${{ matrix.GOOS }}-${{ matrix.GOARCH }}"
        
        if [ "${{ matrix.GOOS }}" = "windows" ]; then
          # For Windows: create zip with .exe binary
          zip -j "dist/$ARCHIVE_NAME.zip" "bin/${{ matrix.GOOS }}-${{ matrix.GOARCH }}/${{ env.BINARY_NAME }}.exe"
          echo "Created Windows archive: dist/$ARCHIVE_NAME.zip"
        else
          # For Linux/macOS: create tar.gz
          tar -czf "dist/$ARCHIVE_NAME.tar.gz" -C "bin/${{ matrix.GOOS }}-${{ matrix.GOARCH }}" "${{ env.BINARY_NAME }}"
          echo "Created Unix archive: dist/$ARCHIVE_NAME.tar.gz"
        fi
        
        echo "Distribution archives:"
        ls -la dist/

    - name: 'Upload Artifact'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: artifacts-${{ matrix.GOOS }}-${{ matrix.GOARCH }}
        path: dist
        retention-days: 1
        if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Download All Artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        path: artifacts
        pattern: artifacts-*
        merge-multiple: true

    - name: Install ChangeLog generator
      # curl rather than wget: the release URL redirects to
      # objects.githubusercontent.com, so redirects have to be followed, and
      # --proto-redir '=https' constrains every hop to HTTPS instead. --proto
      # '=https' rejects a non-HTTPS URL outright. Matches action.yml.
      #
      # The checksum is pinned here rather than fetched from the release's own
      # checksums.txt: a value committed to this repo is reviewed in git, while
      # a checksum file pulled from the same release could be replaced by
      # whoever replaced the tarball. Update both together when bumping.
      env:
        CHGLOG_VERSION: 0.15.1
        CHGLOG_SHA256: 5247e4602bac520e92fca317322fe716968a27aab1d91706f316627e3a3ee8e6
      run: |
        curl -fsSLO --proto '=https' --proto-redir '=https' --tlsv1.2 \
          "https://github.com/git-chglog/git-chglog/releases/download/v${CHGLOG_VERSION}/git-chglog_${CHGLOG_VERSION}_linux_amd64.tar.gz"
        echo "${CHGLOG_SHA256}  git-chglog_${CHGLOG_VERSION}_linux_amd64.tar.gz" | sha256sum -c -
        tar xzf "git-chglog_${CHGLOG_VERSION}_linux_amd64.tar.gz" git-chglog
        
    - name: "Get Last Release"
      id: last_release
      uses: InsonusK/get-latest-release@7a9ff16c8c6b7ead5d71c0f1cc61f2703170eade # v1.1.0
      with:
        myToken: ${{ github.token }}
        exclude_types: "draft|prerelease"

    - name: Generate Changelog
      id: generate-changelog
      run: PATH="${PATH}:." make CHANGELOG.md

    - name: Generate checksums
      run: |
        cd artifacts
        echo "Files available for checksum generation:"
        ls -la
        
        # Create checksums for all archive files
        for file in *.tar.gz *.zip; do
          if [ -f "$file" ]; then
            sha256sum "$file" >> checksums.txt
            echo "Added checksum for: $file"
          fi
        done
        
        echo "Generated checksums:"
        cat checksums.txt

    - name: Create GitHub Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
      with:
        files: |
          artifacts/*.tar.gz
          artifacts/*.zip
          artifacts/checksums.txt
        body_path: ./CHANGELOG.md
        generate_release_notes: true
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Verify Release
      run: |
        echo "✅ Release created successfully!"
        echo "📦 Binaries available in GitHub Releases:"
        echo "   https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"

  docker-build:
    runs-on: ubuntu-latest
    name: Build the docker image
    needs: build
    # Pushes images to ghcr.io using GITHUB_TOKEN.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux Binary for Docker
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: artifacts-linux-amd64
          path: downloaded-artifacts

      - name: Extract Binary for Docker
        run: |
          mkdir -p docker-bin
          cd downloaded-artifacts
          
          # Extract the binary from the archive
          for file in *.tar.gz; do
            if [ -f "$file" ]; then
              tar -xzf "$file" -C ../docker-bin/
              echo "Extracted binary from: $file"
              break
            fi
          done
          
          echo "Binary ready for Docker:"
          ls -la ../docker-bin/

      - name: Build Docker Image
        run: |
          # Use the extracted binary
          cp docker-bin/${{ env.BINARY_NAME }} /usr/local/bin/ || true
          chmod +x /usr/local/bin/${{ env.BINARY_NAME }}
          
          make image IMAGE=ghcr.io/${{env.REPO}}:${{ github.ref_name }}

      - name: Tag latest
        run: docker tag ghcr.io/${{env.REPO}}:${{ github.ref_name }} ghcr.io/${{env.REPO}}:latest

      - name: Push Docker Image
        run: docker push ghcr.io/${{env.REPO}}:${{ github.ref_name }}

      - name: Push Latest Tag
        run: docker push ghcr.io/${{env.REPO}}:latest
  homebrew:
    runs-on: ubuntu-latest
    name: Bump the Homebrew formula
    needs: release
    # A prerelease must not move what `brew install smurf` serves.
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The formula lives in another repository, so the default GITHUB_TOKEN
      # cannot write it. Fail here with something actionable rather than at a
      # git push that reports only "permission denied".
      - name: Require the tap token
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "${TAP_GITHUB_TOKEN}" ]; then
            echo "::error::TAP_GITHUB_TOKEN is not set, so the Homebrew formula cannot be bumped."
            echo "::error::Add a PAT with contents:write on clouddrove/homebrew-tap as the TAP_GITHUB_TOKEN repo secret."
            exit 1
          fi

      - name: Download the published checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern checksums.txt --dir .

      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: clouddrove/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Render the formula
        run: python3 .github/scripts/render_brew_formula.py "${{ github.ref_name }}" checksums.txt tap/Formula/smurf.rb

      - name: Check the formula parses
        run: ruby -c tap/Formula/smurf.rb

      - name: Commit and push
        working-directory: tap
        run: |
          if git diff --quiet -- Formula/smurf.rb; then
            echo "Formula already at ${{ github.ref_name }}, nothing to push."
            exit 0
          fi
          git config user.name clouddrove-bot
          git config user.email bot@clouddrove.com
          git add Formula/smurf.rb
          git commit -m "chore(smurf): update to ${{ github.ref_name }}"
          git push

      - name: Summary
        run: |
          {
            echo "### Homebrew"
            echo
            echo "\`Formula/smurf.rb\` in clouddrove/homebrew-tap is now at \`${{ github.ref_name }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
