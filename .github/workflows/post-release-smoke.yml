name: Post-release smoke

# Everything else in CI validates what the source builds. Nothing validated
# what a user actually downloads: the release archives, the image on ghcr, and
# action.yml as published at the tag. Those are produced by release.yml, which
# runs only on tag push, so a mistake there was invisible until someone hit it.
#
# This runs after a release publishes and checks the artifacts themselves. It
# publishes nothing and needs no secrets beyond reading the release.
on:
  # Not `release: published`. release.yml creates the release with
  # GITHUB_TOKEN, and GitHub deliberately does not raise workflow-triggering
  # events for actions taken with that token, to stop workflows recursing. So
  # the release event never fires for a release this repository publishes,
  # which is every release, and v1.2.0 shipped without this ever running.
  #
  # workflow_run fires on the Release workflow finishing regardless of which
  # token did the work.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to smoke test (e.g. v1.1.9)"
        required: true
        type: string

# Nothing is granted at workflow level; each job asks for exactly what it uses,
# and two of them need no repository access at all.
permissions: {}

concurrency:
  group: post-release-smoke-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  # head_branch on a workflow_run started by a tag push is the tag name.
  TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}

jobs:
  release-assets:
    name: Published release assets
    runs-on: ubuntu-latest
    # Nothing was published if the release failed, and smoke testing a release
    # that does not exist would report a confusing failure on top of a real one.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # Only to read the release through the gh CLI.
    permissions:
      contents: read
    steps:
      # Deliberately no checkout: this job must see only what a stranger can
      # download, so nothing from the repo can mask a missing or broken asset.
      - name: Download every published asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p rel && cd rel
          gh release download "$TAG" --repo "${{ github.repository }}"
          ls -la

      - name: Verify checksums and platform coverage
        run: |
          set -euo pipefail
          cd rel
          test -f checksums.txt || { echo "release has no checksums.txt"; exit 1; }
          sha256sum -c checksums.txt
          for want in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64 windows-arm64; do
            ls -- *"${want}".* >/dev/null 2>&1 || { echo "release is missing platform: $want"; exit 1; }
          done
          echo "all 6 platforms present and every checksum verifies"

      # A downloadable archive that cannot run is the failure this job exists
      # to catch, so the binary is executed rather than merely unpacked.
      - name: Run the published linux binary
        run: |
          set -euo pipefail
          cd rel
          tar -xzf "smurf-${TAG}-linux-amd64.tar.gz"
          ./smurf version
          ./smurf version | grep -Eq "^Version: +${TAG}$" || {
            echo "published binary does not report the tag it was released under"
            ./smurf version; exit 1; }
          ./smurf --help >/dev/null
          ./smurf sdkr --help >/dev/null
          ./smurf selm --help >/dev/null
          ./smurf stf --help >/dev/null

  published-image:
    name: Published container image
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # Pulls a public image and never touches the repository.
    permissions: {}
    steps:
      # Public image, so no login. If this ever needs credentials to pull, that
      # is itself worth knowing about.
      - name: Pull the published image
        run: docker pull "ghcr.io/${{ github.repository }}:${TAG}"

      # The image bundles tools that are installed by pinned downloads during
      # its build. Presence in the Dockerfile is not proof they run.
      - name: Run every bundled tool from the published image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "ghcr.io/${{ github.repository }}:${TAG}" -c '
            set -e
            smurf version
            terraform version
            trivy --version
            gcloud version
            aws --version
            git --version
          '

      - name: Confirm the image carries the released version
        run: |
          set -euo pipefail
          docker run --rm --entrypoint smurf "ghcr.io/${{ github.repository }}:${TAG}" version \
            | grep -Eq "^Version: +${TAG}$" || {
              echo "image reports a different version than the tag it was published under"
              docker run --rm --entrypoint smurf "ghcr.io/${{ github.repository }}:${TAG}" version
              exit 1; }

  published-action:
    name: Action as published (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # Only to check out the released tag.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The action computes its checksum with sha256sum on Linux and shasum on
      # macOS, so a break can affect one platform only.
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # This job checks out a ref and then runs `uses: ./` from it, so the ref
      # decides which code executes. workflow_run grants the base repository's
      # context, which is why the guard above requires the triggering run to
      # have come from this repository, and why the value is checked here
      # against a release tag shape before it reaches checkout. A branch name
      # or a path would not match.
      - name: Validate the tag before checking it out
        env:
          CANDIDATE: ${{ inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$CANDIDATE" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "::error::refusing to check out '$CANDIDATE': not a release tag"
            exit 1
          fi

      # Checked out at the released tag, so `uses: ./` below runs action.yml as
      # published rather than as it sits on master. A workflow cannot put an
      # expression in `uses:`, which is why this is done by checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_branch }}
          persist-credentials: false

      - name: Install the published release through the published action
        uses: ./
        with:
          version: ${{ inputs.tag || github.event.workflow_run.head_branch }}

      - name: Verify what the action installed
        run: |
          set -euo pipefail
          command -v smurf
          smurf version
          smurf version | grep -Eq "^Version: +${TAG}$" || {
            echo "the action installed a different version than requested"; smurf version; exit 1; }
          smurf sdkr --help >/dev/null
          smurf selm --help >/dev/null
          smurf stf --help >/dev/null
          workdir="$(mktemp -d)" && cd "$workdir"
          smurf init
          test -f smurf.yaml

  # A single required status to point branch protection or a release checklist
  # at, rather than three that have to be read individually.
  summary:
    name: Post-release smoke summary
    runs-on: ubuntu-latest
    # Reads only the results of the jobs above.
    permissions: {}
    needs: [release-assets, published-image, published-action]
    if: always()
    steps:
      - name: Report
        run: |
          set -euo pipefail
          echo "assets: ${{ needs.release-assets.result }}"
          echo "image:  ${{ needs.published-image.result }}"
          echo "action: ${{ needs.published-action.result }}"
          if [ "${{ needs.release-assets.result }}" != "success" ] \
            || [ "${{ needs.published-image.result }}" != "success" ] \
            || [ "${{ needs.published-action.result }}" != "success" ]; then
            echo "::error::Release $TAG is published but failed smoke testing. Users are downloading this."
            exit 1
          fi
          echo "Release $TAG verified: assets, image and action all good."
