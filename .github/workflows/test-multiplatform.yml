name: Test on all platforms
on:
  # pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: 1.26.7
  TERRAFORM_VERSION: 1.15.2

jobs:
  test:
    name: Test on all platforms
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-13
          - windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform on Windows
        if: matrix.os == 'windows-latest'
        run: |
          choco install terraform --version=${{ env.TERRAFORM_VERSION }} -y
          echo "C:\Program Files\Terraform" >> $env:GITHUB_PATH
          terraform -version

      - name: Set up Terraform on Linux/macOS
        if: matrix.os != 'windows-latest'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup Docker on macOS
        if: matrix.os == 'macos-13'  
        uses: douglascamata/setup-docker-macos-action@d5ccc6aae0ce23e7700154f5e63cc53e6433ac48 # v1.1.0

      - name: Set up QEMU on Linux/macOS
        if: matrix.os != 'windows-latest'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
       
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Print PATH for Debugging
        run: echo $env:PATH  # Check if Terraform is in PATH

      - name: Run Tests
        run: go test ./...
#