---
version: 2
updates:   
  - package-ecosystem: "github-actions" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    # Add assignees
    assignees:
      - "clouddrove-ci"
    # Add reviewer
    reviewers: 
      - "anmolnagpal"
      - "anketclouddrove"
      
  - package-ecosystem: "gomod" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    # Add assignees
    assignees:
      - "clouddrove-ci"
    # Add reviewer
    reviewers:
      - "anmolnagpal"
      - "anketclouddrove"

  # docs/sm MkDocs site. Without this entry the requirements manifest was
  # never updated, so its advisories only ever surfaced as alerts.
  - package-ecosystem: "pip"
    directory: "/docs/sm/docs"
    schedule:
      interval: "weekly"
    assignees:
      - "clouddrove-ci"
    reviewers:
      - "anmolnagpal"
      - "anketclouddrove"

  # Azure DevOps extension task, which ships its own package-lock.json.
  - package-ecosystem: "npm"
    directory: "/azure-devops-extension/Smurf"
    schedule:
      interval: "weekly"
    assignees:
      - "clouddrove-ci"
    reviewers:
      - "anmolnagpal"
      - "anketclouddrove"
